<style>
:root{--bg:#0b0d12;--card:#151922;--card2:#1d2330;--tx:#e8ecf3;--mu:#8a93a6;--ac:#ff5a1f;--ok:#2ecc71;--bad:#e74c3c;--gold:#f5c542}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#0b0d12,#0b0d12ee);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #222}
.rank{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.rank b{color:var(--gold);font-size:18px}.small{font-size:13px;color:var(--mu)}
.bar{height:10px;background:#222;border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--gold))}
main{padding:12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:18px}h3{margin:12px 0 6px;font-size:15px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.task{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 12px;margin:6px 0;border:0;border-radius:12px;background:var(--card2);color:var(--tx);font-size:16px;text-align:left}
.task .ck{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid var(--mu);display:flex;align-items:center;justify-content:center;font-weight:900}
.task.done{opacity:.55}.task.done .ck{background:var(--ok);border-color:var(--ok);color:#000}
.task.now{outline:2px solid var(--ac)}.task .pt{margin-left:auto;color:var(--gold);font-weight:700;font-size:14px;white-space:nowrap}
.task small{display:block;color:var(--mu);font-size:13px}
.now-box{background:linear-gradient(135deg,#3a1406,#151922);border:1px solid var(--ac)}
.big{font-size:30px;font-weight:900}
button.btn{min-height:50px;padding:0 18px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:700}
button.sec{background:var(--card2)}button.full{width:100%;margin-top:8px}
input,textarea,select{width:100%;min-height:50px;padding:10px 12px;border-radius:12px;border:1px solid #333;background:#0f1218;color:var(--tx);font-size:17px}
textarea{min-height:110px}.row{display:flex;gap:8px;margin:6px 0}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#10131a;border-top:1px solid #222;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-height:64px;border:0;background:none;color:var(--mu);font-size:12px}nav button span{display:block;font-size:22px}
nav button.on{color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats div{background:var(--card2);border-radius:12px;padding:10px}
.stats b{display:block;font-size:22px}
.list div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222}
.x{background:none;border:0;color:var(--bad);font-size:18px;padding:0 8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--gold);color:#000;padding:12px 18px;border-radius:12px;font-weight:800;display:none;z-index:9;max-width:90%}
.warn{background:#3a0e0e;border:1px solid var(--bad)}.hide{display:none}
canvas{width:100%;height:200px;background:#0f1218;border-radius:12px}

/* ===== Game UI overhaul ===== */
body{background:radial-gradient(120% 60% at 50% -10%,#1b1f2e 0%,#0b0d12 60%) fixed}
header{background:linear-gradient(180deg,#0e1119f2,#0b0d12e6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hud{display:flex;align-items:center;gap:10px}.hud .bdg{flex:0 0 44px;height:52px}.hud .mid{flex:1;min-width:0}
.hud .rk{font-weight:900;color:var(--gold);font-size:17px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .chips{display:flex;gap:6px;flex:0 0 auto}.chip{background:#1d2330;border:1px solid #2a3142;border-radius:20px;padding:4px 9px;font-weight:800;font-size:13px;white-space:nowrap}

.xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff5a1f,#ffb020,#f5c542);border-radius:8px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.xpbar i:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff6 50%,transparent 70%);background-size:200% 100%;animation:shine 2.4s linear infinite}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
.card{background:linear-gradient(180deg,#171b26,#131720);border:1px solid #222838;box-shadow:0 6px 18px #0006}
.task{position:relative;border-left:4px solid var(--cc,#444);background:linear-gradient(90deg,#1f2533,#1a1f2b);transition:transform .12s}
.task:active{transform:scale(.97)}
.task.done .ck{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.task[data-cat="Сън"]{--cc:#6c7bff}.task[data-cat="Храна"]{--cc:#2ecc71}.task[data-cat="Тяло"]{--cc:#ff5a1f}.task[data-cat="Ум"]{--cc:#b07cff}.task[data-cat="Пари"]{--cc:#f5c542}.task[data-cat="Хора"]{--cc:#2ec4d6}
.xpPop{position:fixed;z-index:30;font-weight:900;color:var(--gold);font-size:22px;text-shadow:0 2px 6px #000;pointer-events:none;animation:xpup 1s ease-out forwards}
@keyframes xpup{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-70px) scale(1.4)}}
.ring{display:flex;align-items:center;gap:14px}.ring svg circle{transition:stroke-dashoffset 1s ease}
.lvlup{position:fixed;inset:0;z-index:40;background:radial-gradient(circle,#3a1406ee,#000e);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:fadein .3s}
.lvlup .bdgBig{animation:zoom .7s cubic-bezier(.2,1.6,.4,1)}.lvlup h1{font-size:34px;margin:10px 0;color:var(--gold)}
@keyframes zoom{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}@keyframes fadein{from{opacity:0}to{opacity:1}}
.conf{position:absolute;top:-10px;width:9px;height:14px;animation:fall 2.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.boss{background:linear-gradient(135deg,#2a0f14,#171b26);border:1px solid #5a1a22;border-radius:14px;padding:12px;margin:10px 0}
.boss .hp{height:14px;border-radius:8px;background:#311;overflow:hidden;margin:8px 0;border:1px solid #622}.boss .hp i{display:block;height:100%;background:linear-gradient(90deg,#e74c3c,#ff7b5a);transition:width .8s}
.boss.dead{filter:grayscale(.6);opacity:.75}
nav{background:#0e1119f5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
nav button{position:relative;transition:color .2s}nav button.on:before{content:"";position:absolute;top:6px;left:50%;width:44px;height:30px;transform:translateX(-50%);background:#ff5a1f22;border-radius:14px}
nav button.on span{transform:translateY(-2px) scale(1.12)}nav button span{transition:transform .2s}
.heroIdle{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}@keyframes breathe{50%{transform:scaleY(1.015) translateY(-1px)}}
.heroCheer{animation:cheer .6s ease}@keyframes cheer{30%{transform:translateY(-14px) scale(1.05)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
.aura{border-radius:50%;animation:aura 2.4s ease-in-out infinite}@keyframes aura{50%{opacity:.55;transform:scale(1.06)}}
.stat{display:flex;align-items:center;gap:8px;margin:5px 0}.stat span{flex:0 0 132px;font-size:14px;white-space:nowrap}.stat .bar{flex:1;margin:0}.stat b{flex:0 0 30px;text-align:right}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
// ---------- PWA: icons, manifest, service worker + update prompt ----------
(function(){try{
 var http=location.protocol.indexOf('http')===0;
 function link(rel,href,extra){var l=document.createElement('link');l.rel=rel;l.href=href;if(extra)for(var k in extra)l.setAttribute(k,extra[k]);document.head.appendChild(l)}
 if(http){link('manifest','manifest.json');link('icon','icon-192.png',{sizes:'192x192'});link('apple-touch-icon','apple-touch-icon.png')}
 else{var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#0b0d12"/><text x="256" y="350" font-size="300" text-anchor="middle" fill="#ff5a1f" font-family="Arial" font-weight="900">С</text></svg>';link('icon','data:image/svg+xml,'+encodeURIComponent(svg))}
 if(http&&'serviceWorker' in navigator){
  var showUpd=function(w){if(document.getElementById('updBar'))return;var b=document.createElement('div');b.id='updBar';b.style.cssText='position:fixed;left:10px;right:10px;bottom:84px;z-index:60;background:#f5c542;color:#000;border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;font-weight:800;box-shadow:0 6px 20px #000a';
   b.innerHTML='<span style="flex:1">🆕 Нова версия на Система</span><button style="min-height:44px;border:0;border-radius:10px;background:#0b0d12;color:#fff;font-weight:800;padding:0 14px">ОБНОВИ</button>';b.querySelector('button').onclick=function(){w.postMessage('skipWaiting')};document.body.appendChild(b)};
  var reloading=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(reloading)return;reloading=true;location.reload()});
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(reg){
   if(reg.waiting&&navigator.serviceWorker.controller)showUpd(reg.waiting);
   reg.addEventListener('updatefound',function(){var w=reg.installing;w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)showUpd(w)})});
   setInterval(function(){reg.update().catch(function(){})},60*60*1000);document.addEventListener('visibilitychange',function(){if(!document.hidden)reg.update().catch(function(){})});
  }).catch(function(){})});
 }
 // install button support
 window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window._instEvt=e;var b=document.getElementById('instBtn');if(b)b.style.display='block'});
}catch(e){}})();

// ---------- Storage ----------
var KEY='sistema_v1';
var S=load();
function def(){return{xp:0,streak:0,best:0,lastDay:null,days:{},expenses:[],wishlist:[],weights:[],meas:[],accounts:[{id:'cash',n:'Кеш',bal:0},{id:'bank',n:'Банка',bal:0},{id:'card',n:'Карта',bal:0}],bills:[],campNights:[],plans:[],campRate:13,defaultAcc:'cash',wlog:{},prs:[{d:todayKey(),ex:'Лицеви опори',v:30}],gym:false,kcal:2900,goal:100,height:178,bar:false,budget:120,bosses:{},start:todayKey(),log:[]}}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&typeof d==='object'){var b=def();for(var k in b)if(!(k in d))d[k]=b[k];return d}}catch(e){}return def()}
function save(){if(typeof syncAlarms==='function')syncAlarms();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ Неуспешен запис!')}if(typeof syncSoon==='function')syncSoon()}
var AND=(function(){try{return window.Android||null}catch(e){return null}})();
if(AND&&AND.vibrate){try{Object.defineProperty(navigator,'vibrate',{value:function(p){AND.vibrate(JSON.stringify(p));return true},configurable:true})}catch(e){}}
function uid(){return Date.now()*1000+Math.floor(Math.random()*1000)}
function pad(n){return(n<10?'0':'')+n}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayKey(){return keyOf(new Date())}
function parseKey(k){var p=k.split('-');return new Date(+p[0],p[1]-1,+p[2])}
function dayDiff(a,b){return Math.round((parseKey(b)-parseKey(a))/864e5)}
function weekKey(d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return keyOf(d)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

// ---------- Ranks ----------
var RANKS=['Новобранец','Редник','Ефрейтор','Легионер','Сержант','Центурион','Воин','Ветеран','Страж','Рицар','Командир','Воевода','Болярин','Цар на себе си'];
function lvlFromXp(x){var l=1,need=300;while(x>=need){x-=need;l++;need=Math.round(need*1.15)}return{l:l,cur:x,need:need}}
function rankOf(l){return RANKS[Math.min(RANKS.length-1,Math.floor((l-1)/2))]}

// ---------- Workout scaling ----------
function weekNo(){return Math.max(0,Math.floor(dayDiff(S.start,todayKey())/7))}
var PLAN=[
 {n:'Почивка / активно възстановяване',k:'rest'},
 {n:'ТЛАСКАНЕ (гърди, рамене, трицепс)',k:'push'},
 {n:'КРАКА',k:'legs'},
 {n:'ДЪРПАНЕ + КОР',k:'pull'},
 {n:'КАРДИО',k:'cardio'},
 {n:'ТЛАСКАНЕ + КОР',k:'push2'},
 {n:'КРАКА + КАРДИО',k:'legs2'}]; // index = getDay() (0=нд)
function prog(dt){dt=dt||new Date();var w=weekNo(),g=S.gym,b=S.bar,P=PLAN[dt.getDay()],E=[];
 function ex(n,sets,reps,u,rest){E.push({n:n,sets:sets,reps:reps,u:u||'повт.',rest:rest||90})}
 var pr=20+2*w,ps=4;if(pr>36){ps=5;pr=26+2*(w-8)}if(pr>36){ps=6;pr=36}
 var pull=b?['Набирания',4,Math.min(15,4+w)]:['Обратни гребания (маса/въже)',4,Math.min(25,10+2*w)];
 if(P.k==='push'){ex('Лицеви опори',ps,pr);ex(g?'Лег преса с щанга':'Лицеви с крака на високо',4,g?Math.min(12,6+w):Math.min(25,10+w));ex(g?'Военна преса':'Пайк лицеви (рамене)',3,Math.min(20,8+w));ex('Кофички (стол/стъпало)',3,Math.min(30,12+2*w))}
 if(P.k==='push2'){ex('Диамантени лицеви',4,Math.min(25,10+w));ex('Широки лицеви',3,Math.min(30,15+w));ex('Планк',3,40+10*w,'сек',60);ex('Обратни коремни',3,Math.min(30,12+2*w),'повт.',60)}
 if(P.k==='legs'||P.k==='legs2'){ex(g?'Клек с щанга':'Клякания',4,g?Math.min(12,6+w):Math.min(60,30+3*w));ex('Напади (всеки крак)',3,Math.min(25,10+w));ex('Български клек (всеки крак)',3,Math.min(20,8+w));ex('Повдигане на пръсти',3,Math.min(50,20+3*w),'повт.',60)}
 if(P.k==='legs2')ex('Бягане/бързо ходене',1,Math.min(8,2+Math.floor(w/2)),'км',0);
 if(P.k==='pull'){ex(pull[0],pull[1],pull[2]);ex(g?'Гребане с дъмбел':'Гребане с туба вода/раница',4,Math.min(20,10+w));ex('Супермен (гръб)',3,Math.min(30,12+2*w),'повт.',60);ex('Планк',3,40+10*w,'сек',60);ex('Страничен планк (всяка страна)',2,30+5*w,'сек',45)}
 if(P.k==='cardio'){ex('Бърпита',5,Math.min(20,8+w),'повт.',60);ex(w<2?'Бързо ходене':'Бягане',1,Math.min(10,2+Math.floor(w/2)),'км',0);ex('Скачане на въже / jumping jacks',3,Math.min(150,60+10*w),'повт.',45)}
 if(P.k==='rest'){ex('Разходка',1,Math.min(15000,6000+750*w),'крачки',0);ex('Разтягане / мобилност',1,15,'мин',0)}
 return{n:P.n,k:P.k,ex:E}}
function workout(){var w=weekNo(),L=lvlFromXp(S.xp).l,k=w+Math.floor(L/2);
 return{push:20+k*5,squat:30+k*8,plank:40+k*10,walk:Math.min(15000,6000+k*750),run:k<2?0:Math.min(10,1+Math.floor((k-2)/2)),burpee:k<1?0:5+k*2}}
// ---------- Social challenges ----------
var SOC=['Започни разговор с непознат (касиер, колега, съсед) – минимум 3 изречения.','Направи искрен комплимент на някого (не за външност).','Днес преди да кажеш мнение – задай поне 2 въпроса. Слушай.','Обади се на родител/брат/сестра – минимум 10 минути.','Поздрави 5 души с поглед в очите и усмивка.','Попитай колега как е и задай уточняващ въпрос за отговора.','Пиши на стар приятел и предложи среща.','Разкажи кратка история на някого – ясно, без "ъъ".','Запомни името на нов човек и го използвай.','Благодари на някого конкретно за нещо, което е направил.','Поискай съвет от някой по-опитен.','Обади се на баба/дядо или роднина, с когото не си говорил отдавна.'];
var BOSSES=[
 {n:'Подход',d:'Заговори непозната жена (кафене, магазин, събитие). Цел: 2 минути разговор. Резултатът не е важен – важно е действието.',xp:300},
 {n:'Нов кръг',d:'Иди на ново място с хора: фитнес клас, катерене, туризъм, доброволчество, езиков клуб.',xp:250},
 {n:'Покана',d:'Покани някого (жена или нов приятел) на кафе/разходка с конкретен ден и час.',xp:350},
 {n:'Финансов одит',d:'Събери всички разходи от седмицата, намери 1 изтичане на пари и го спри.',xp:200},
 {n:'Дълъг марш',d:'Ходене/туризъм 15+ км наведнъж в планината.',xp:250},
 {n:'Дигитален пост',d:'24 часа без социални мрежи и YouTube.',xp:250},
 {n:'Кемпер ред',d:'Пълно почистване и подреждане на кемпера. Изхвърли 10 ненужни неща.',xp:150},
 {n:'Умение',d:'2 часа учене на ново умение (готвене, език, сертификат за работа).',xp:200},
 {n:'Профил',d:'Направи хубави снимки и честен профил в приложение за запознанства ИЛИ запиши се в клуб с много хора.',xp:200},
 {n:'Семейство',d:'Посети родителите/семейството лично и им помогни с нещо.',xp:200}];
function weekBosses(){var wk=weekKey(new Date()),n=parseInt(wk.replace(/-/g,''),10);var a=BOSSES[n%BOSSES.length],b=BOSSES[(n*7+3)%BOSSES.length];if(a===b)b=BOSSES[(BOSSES.indexOf(a)+1)%BOSSES.length];return[BOSSES[0],a===BOSSES[0]?b:a]}

// ---------- Daily tasks ----------
function lastKg(){for(var i=S.meas.length-1;i>=0;i--)if(S.meas[i].kg)return S.meas[i].kg;return 70}

 return page(since).then(function(rows){var maxTs=since;rows.forEach(function(r){if(r.server_ts>maxTs)maxTs=r.server_ts});return{rows:rows,maxTs:maxTs}})}
function cloudSync(){if(cloud.busy)return cloud.busy;if(!authGet()){cloudStatus('off');return Promise.resolve()}if(!navigator.onLine){cloudStatus('offline');return Promise.resolve()}
 cloudStatus('sync');cloud.busy=authValid().then(function(a){var first=!csGet().since;
  return cloudPull(a).then(function(res){var recs=res.rows.map(function(r){return{path:r.key,data:r.data,updatedAt:+r.updated_at,deleted:r.deleted}});
   if(first&&recs.length){var rc=recs.filter(function(x){return x.path==='core'})[0],remoteXp=rc&&rc.data?rc.data.xp||0:0,localWins=(S.xp||0)>remoteXp;
    var m=syncMeta(),now=Date.now();recs.forEach(function(x){if(m.hash[x.path]){if(localWins){m.rev[x.path]=Math.max(now,x.updatedAt+1);m.dirty[x.path]=1}else{m.rev[x.path]=0}}});syncSaveMeta(m)}
   if(first){var m2=syncMeta();for(var p in m2.hash)m2.dirty[p]=1;for(var t in m2.tomb)m2.dirty[t]=1;syncSaveMeta(m2)}
   return prepPull(a,recs).then(function(rr){if(rr.length)SistemaSync.applyRemote(rr);var c=csGet();c.since=new Date(Math.max(0,new Date(res.maxTs).getTime()-5000)).toISOString();csSet(c)})})
  .then(function(){var pend=SistemaSync.pending();if(!pend.length)return;var chunks=[];for(var i=0;i<pend.length;i+=200)chunks.push(pend.slice(i,i+200));
   return chunks.reduce(function(pr,ch){return pr.then(function(){return prepPush(a,ch).then(function(out){return cfetch('/rest/v1/rpc/push_records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows:out.map(function(x){return{key:x.path,data:x.data,updated_at:x.updatedAt,deleted:x.deleted}})})},a).then(function(){SistemaSync.markSynced(ch)})})})},Promise.resolve())})
  .then(function(){var c=csGet();c.lastOk=Date.now();c.email=a.user&&a.user.email;csSet(c);cloud.err='';cloudStatus('ok');if(!cloud.firstDone){cloud.firstDone=true;tick()}})})
  .catch(function(e){if(e.message==='nologin')cloudStatus('off');else if(!navigator.onLine||e instanceof TypeError)cloudStatus('offline',String(e.message));else cloudStatus('err',String(e.message));if(!cloud.firstDone){cloud.firstDone=true;tick()}})
  .then(function(){cloud.busy=false});return cloud.busy}
var cloudDeb=null;function cloudSoon(){clearTimeout(cloudDeb);cloudDeb=setTimeout(cloudSync,2500)}
function cloudStart(fresh){if(fresh){var c=csGet();delete c.since;csSet(c)}clearInterval(cloud.timer);cloud.timer=setInterval(function(){if(!document.hidden)cloudSync()},30000);SistemaSync.onLocalChange=cloudSoon;SistemaSync.adapter='supabase';cloudSync();if(view==='more')render()}
function cloudLogout(){var a=authGet();if(a)cfetch('/auth/v1/logout',{method:'POST'},a).catch(function(){});authSet(null);localStorage.removeItem(CS_KEY);clearInterval(cloud.timer);SistemaSync.onLocalChange=null;cloud.firstDone=true;cloudStatus('off','');render()}
window.addEventListener('online',function(){cloudSync()});window.addEventListener('offline',function(){if(authGet())cloudStatus('offline')});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&authGet())cloudSync()});
function cloudCard(){var a=authGet(),c=csGet(),o='<div class="card"><h2>☁️ Синхронизация (телефон ⇄ лаптоп)</h2>';
 if(a){o+='<div>Влязъл като <b>'+esc((a.user&&a.user.email)||c.email||'')+'</b></div><div class="small" id="cloudStat">'+esc(cloudStatusText())+'</div><button class="btn full" id="csync">⟳ Синхронизирай сега</button><button class="btn sec full" id="cout">Изход</button><div class="small">Данните са видими само за твоя акаунт. Работи и без интернет – синхронизира, когато има връзка.</div>'}
 else{o+='<div class="small">Влез с имейл на всяко устройство (телефон и лаптоп) – данните се обединяват автоматично.</div><input id="cemail" type="email" inputmode="email" autocomplete="email" placeholder="твоят@имейл" value="'+esc(cloud.pendingEmail||'')+'"><button class="btn full" id="csend">📧 Изпрати линк/код за вход</button>';
  if(cloud.pendingEmail)o+='<div class="small" style="margin-top:8px">Провери пощата си (и „Спам“). <b>Отвори линка на това устройство</b> – влизаш автоматично. Ако имейлът съдържа 6-цифрен код, въведи го:</div><div class="row"><input id="ccode" inputmode="numeric" maxlength="6" placeholder="123456"><button class="btn sec" id="cver" style="flex:.6">Потвърди</button></div>';
  if(cloud.err)o+='<div class="small" style="color:var(--bad)">'+esc(cloud.err)+'</div>';if(location.protocol==='file:')o+='<div class="small">⚠️ Във файловия/APK режим вход с линк не работи – използвай онлайн версията.</div>'}
 return o+'</div>'}
function cloudBind(){var $=function(x){return document.getElementById(x)},b;
 if(b=$('csync'))b.onclick=function(){cloudSync().then(function(){toast(cloud.state==='ok'?'☁️ Синхронизирано':cloudStatusText())})};
 if(b=$('cout'))b.onclick=function(){if(confirm('Изход? Данните остават на това устройство.'))cloudLogout()};
 if(b=$('csend'))b.onclick=function(){var e=$('cemail').value.trim();if(!/^\S+@\S+\.\S+$/.test(e))return toast('Невалиден имейл');b.disabled=true;cloudSendCode(e).then(function(){cloud.err='';toast('📧 Изпратено на '+e);render()},function(er){cloud.err=/429|rate/i.test(er.message)?'Твърде много опити – изчакай малко.':er.message;render()})};
 if(b=$('cver'))b.onclick=function(){var k=$('ccode').value.trim();cloudVerify(cloud.pendingEmail,k).then(function(){toast('✅ Влезе успешно');render()},function(er){cloud.err='Грешен или изтекъл код';render()})}}

function migrate(){var v=S.schemaVersion||1;if(v<3){S.heroName=S.heroName||'';S.coins=S.coins||0;
 (S.clothes||[]).forEach(function(c){if(!c.color&&c.img){var im=new Image();im.onload=function(){var cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);c.color=avgColor(cv);save()};im.src=c.img}})}
 if(v<4){ensureMoney()}
 S.schemaVersion=4;save()}

tick();

setInterval(function(){if(view==='today'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA')tick()},60000);
